name: Publish production images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Git commit SHA to publish
        required: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/brtwm/fuelsight-backend
            dockerfile: backend/Dockerfile
          - name: frontend
            image: ghcr.io/brtwm/fuelsight-frontend
            dockerfile: frontend/Dockerfile.production
          - name: airflow
            image: ghcr.io/brtwm/fuelsight-airflow
            dockerfile: backend/airflow/Dockerfile.production
    steps:
      - name: Validate release commit
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy result
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
