name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published 40-character git commit SHA
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment bundle
        run: |
          tar -czf /tmp/fuelsight-deploy.tgz \
            compose/docker-compose.production.yml \
            compose/env/production.env.example \
            compose/init/01-create-airflow-db.sql \
            compose/nginx/fuelsight.conf.example \
            scripts/backup-production.sh \
            scripts/bootstrap-production.sh \
            scripts/deploy-production.sh

      - name: Copy deployment bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -P "$VPS_PORT" /tmp/fuelsight-deploy.tgz \
            "$VPS_USER@$VPS_HOST:/tmp/fuelsight-deploy.tgz"

      - name: Install deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p /opt/fuelsight && \
             tar -xzf /tmp/fuelsight-deploy.tgz -C /opt/fuelsight && \
             chmod 750 /opt/fuelsight/scripts/*.sh"

      - name: Log VPS into GHCR
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | \
            ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

      - name: Deploy and verify
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "/opt/fuelsight/scripts/deploy-production.sh '$IMAGE_TAG'"
