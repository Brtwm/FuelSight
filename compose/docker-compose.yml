x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: backend/airflow/Dockerfile
  profiles: ["airflow"]
  env_file:
    - ./env/airflow.env
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ../backend/airflow/dags:/opt/airflow/dags
    - ../backend/airflow/plugins:/opt/airflow/plugins
    - ../backend/airflow/inbox:/opt/fuelsight/inbox
    - model_artifacts:/opt/fuelsight/artifacts/models
    - news_index:/opt/fuelsight/artifacts/news
    - external_cache:/opt/fuelsight/artifacts/external
    - airflow_logs:/opt/airflow/logs

services:
  db:
    image: pgvector/pgvector:pg16
    profiles: ["core", "airflow"]
    env_file:
      - ./env/db.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-create-airflow-db.sql:/docker-entrypoint-initdb.d/01-create-airflow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-airflow-init:
    image: pgvector/pgvector:pg16
    profiles: ["airflow"]
    env_file:
      - ./env/db.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      export PGPASSWORD=$$POSTGRES_PASSWORD &&
      psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -tc \"SELECT 1 FROM pg_database WHERE datname='airflow'\" |
      grep -q 1 || psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -c \"CREATE DATABASE airflow\"
      "

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ["core"]
    env_file:
      - ./env/backend.env
    ports:
      - "8061:8061"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/airflow/inbox:/opt/fuelsight/inbox
      - model_artifacts:/opt/fuelsight/artifacts/models
      - news_index:/opt/fuelsight/artifacts/news
      - external_cache:/opt/fuelsight/artifacts/external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8061/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    profiles: ["core"]
    env_file:
      - ./env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    depends_on:
      db:
        condition: service_healthy
      db-airflow-init:
        condition: service_completed_successfully
    command:
      [
        "bash",
        "-lc",
        "airflow db migrate && airflow users create --username \"$${_AIRFLOW_WWW_USER_USERNAME}\" --password \"$${_AIRFLOW_WWW_USER_PASSWORD}\" --firstname Fuel --lastname Sight --role Admin --email admin@fuelsight.local || true",
      ]

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: ["airflow", "webserver"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 20s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME",
        ]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  model_artifacts:
  news_index:
  external_cache:
  airflow_logs:
