      LLM_PROVIDER: none
      DEFENSE_MODE: "true"
      DEFENSE_PROFILE: offline-safe

  airflow-webserver:
    environment:
      ENABLE_LLM: "false"
      EXTERNAL_INDICATORS_MODE: manual_snapshot
      LLM_PROVIDER_MODE: retrieval_only
      LLM_PROVIDER: none
      DEFENSE_MODE: "true"
      DEFENSE_PROFILE: offline-safe

  airflow-scheduler:
    environment:
      ENABLE_LLM: "false"
      EXTERNAL_INDICATORS_MODE: manual_snapshot
      LLM_PROVIDER_MODE: retrieval_only
      LLM_PROVIDER: none
      DEFENSE_MODE: "true"
      DEFENSE_PROFILE: offline-safe
