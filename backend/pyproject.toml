[project]
name = "fuelsight-backend"
version = "0.1.0"
description = "FuelSight backend skeleton"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.17.1",
  "bcrypt>=4.0.0",
  "catboost>=1.2.8",
  "fastapi>=0.138.1",
  "mako>=1.3.12",
  "openpyxl>=3.1.5",
  "pyjwt>=2.13.0",
  "python-multipart>=0.0.32",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.44",
  "psycopg[binary]>=3.2.12",
  "uvicorn[standard]>=0.38.0",
  "reportlab>=4.5.0",
  "defusedxml>=0.7.1",
]

[project.scripts]
fuelsight-seed-core = "app.scripts.seed_core:main"
fuelsight-pipeline = "app.scripts.pipeline_runner:main"
fuelsight-create-reviewer = "app.scripts.create_reviewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.0.3",
  "ruff>=0.14.2"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
